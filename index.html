<!DOCTYPE html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#c9a12c'>
<link rel='manifest' href='manifest.json'>
<title>Golden 50 | Ruperto G. Magabo Jr.</title>
<style>
body{margin:0;font-family:system-ui;background:#faf7ef;color:#333}
.hero{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
background:linear-gradient(180deg,#fff,#f6ecd0);}
.card{max-width:700px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:center}
h1{font-size:58px;color:#c9a12c;margin:0}
.gold{color:#c9a12c}
.btn{display:inline-block;margin:8px;padding:14px 24px;border-radius:30px;background:#c9a12c;color:white;text-decoration:none}
.sec{padding:50px 20px;max-width:900px;margin:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.ph{height:180px;border:2px dashed #c9a12c;border-radius:16px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<section class='hero'><div class='card'>
<div class='gold'>✨ YOU'RE INVITED ✨</div>
<h1>50</h1>
<h2 class='gold'>Golden Birthday Celebration</h2>
<h3>Ruperto G. Magabo Jr.</h3>
<p><b>August 15, 2026</b><br>2:00 PM onwards<br>Lipa Grill</p>
<h2 id='cd'></h2>
<a class='btn' href='https://maps.google.com/?q=Lipa+Grill+Lipa+City'>📍 View Location</a>
<a class='btn' href='#rsvp'>💌 RSVP</a>
</div></section>
<section class='sec'><h2>Gallery</h2><div class='gallery'>
<div class='ph'>Add Photo</div><div class='ph'>Add Photo</div><div class='ph'>Add Photo</div>
</div></section>
<section class='sec' id='rsvp'><h2>RSVP</h2>
<input placeholder='Your Name' style='padding:12px;width:100%;max-width:400px'><br><br>
<textarea placeholder='Message' style='padding:12px;width:100%;max-width:400px;height:120px'></textarea><br><br>
<button class='btn'>Send</button></section>
<script>
const t=new Date('2026-08-15T14:00:00');
setInterval(()=>{
let diff=t-new Date();
if(diff<0){cd.textContent='See you at the celebration!';return;}
let d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
cd.textContent=`${d}d ${h}h ${m}m ${s}s`;
},1000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script></body></html>
